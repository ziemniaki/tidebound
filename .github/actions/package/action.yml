name: Package players
description: Build and upload the three player archives from the checked-out commit.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: '0.12.1'
        enable-cache: true
        cache-dependency-glob: uv.lock
    - shell: bash
      run: uv sync --locked
    - name: Stage and verify Mac, Windows and Linux player archives
      shell: bash
      run: uv run --locked python -m tidebound_dev.release.candidates "$RUNNER_TEMP/candidate"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tidebound-release-candidate
        path: ${{ runner.temp }}/candidate/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
