name: Complete Tidebound pond 0.8.4
on:
  push:
    branches: [build/pond-0.8.4]
    paths:
      - .github/workflows/pond-recovery.yml
      - Development/finish_pond_release.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tidebound-pond-084
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: build/pond-0.8.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install rubymarshal==1.2.10 Pillow reportlab
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Restore and verify pond source
        run: python Development/finish_pond_release.py prepare
      - name: Save completed source on build branch
        run: |
          git config user.name "Tidebound Build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add Development/024_PondGeometry.rb Development/025_Pond.rb Development/pond_map.py Development/pond_manifest.json Development/Tests/pond_geometry.py Development/Tests/pond_native.rb Development/validation_pond.md Graphics/Tilesets/TideboundPond.png
          git diff --cached --check
          git commit -m "Rebuild and verify southern pond 0.8.4 on hosted runner"
          git push origin HEAD:build/pond-0.8.4
      - name: Build and verify distributions
        run: python Development/finish_pond_release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: Tidebound-0.8.4-verified
          path: |
            ../pond-release/*.zip
            ../pond-release/SHA256SUMS.txt
            ../pond-release/RELEASE_NOTES.md
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.4 >/dev/null 2>&1; then
            echo "Release v0.8.4 already exists; refusing to overwrite it."
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          gh release create v0.8.4 ../pond-release/Tidebound_Mac_0.8.4.zip ../pond-release/Tidebound_Project_0.8.4.zip ../pond-release/SHA256SUMS.txt --target "$SOURCE_SHA" --title "Tidebound 0.8.4 - Southern Pond" --notes-file ../pond-release/RELEASE_NOTES.md
