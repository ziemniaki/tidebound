name: Verify and build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Development/Tests/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix Development/Tests --ignore-scripts
      - run: python Development/verify.py
      - name: Rebuild in an isolated copy and compare generated assets
        if: runner.os == 'Linux'
        run: python Development/check_rebuild.py
      - name: Verification must not modify tracked source or game data
        run: git diff --exit-code

  package:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Development/Tests/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix Development/Tests --ignore-scripts
      - name: Stage and verify universal Mac and editable project archives
        run: python Development/build_release.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-mac:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Verify downloaded artifacts
        working-directory: ${{ runner.temp }}/candidate
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Run native packaged-engine smoke
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: python Development/Tests/mac_runtime_smoke.py "$RUNNER_TEMP"/candidate/Tidebound_Mac_*_universal.zip "$RUNNER_TEMP/smoke" --arch "$TEST_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14
