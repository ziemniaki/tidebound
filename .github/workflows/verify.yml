name: Full verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit to verify (defaults to selected branch/tag)
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Development/Tests/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix Development/Tests --ignore-scripts
      - run: python Development/verify.py
      - name: Rebuild in an isolated copy and compare generated assets
        if: runner.os == 'Linux'
        run: python Development/check_rebuild.py
      - name: Verification must not modify tracked source or game data
        run: git diff --exit-code

  package:
    needs: verify
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: Development/Tests/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix Development/Tests --ignore-scripts
      - name: Stage and verify Mac, Windows and editable project archives
        run: python Development/build_release.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-mac:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Verify downloaded artifacts
        working-directory: ${{ runner.temp }}/candidate
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Run native packaged-engine smoke
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: python Development/Tests/mac_runtime_smoke.py "$RUNNER_TEMP"/candidate/Tidebound_Mac_*_universal.zip "$RUNNER_TEMP/smoke" --arch "$TEST_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Verify downloaded artifacts
        run: python Development/verify_artifacts.py "$env:RUNNER_TEMP/candidate"
      - name: Prepare pinned software OpenGL for the hosted runner
        run: ./Development/Tests/setup_windows_ci.ps1
      - name: Run native Windows packaged-engine smoke
        env:
          # Hosted Windows has no audio output device. This affects CI only.
          ALSOFT_DRIVERS: 'null'
        run: |
          $archive = Get-Item "$env:RUNNER_TEMP/candidate/Tidebound_Windows_*_x64.zip"
          python Development/Tests/windows_runtime_smoke.py $archive.FullName "$env:RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-smoke-windows-x64
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14
