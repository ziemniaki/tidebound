name: Full verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 40-character commit SHA to verify (defaults to selected branch/tag commit)
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - id: commit
        name: Require one immutable commit for every verification job
        env:
          REQUESTED_REF: ${{ inputs.ref || github.sha }}
        run: |
          python - <<'PY'
          import os, re
          sha = os.environ['REQUESTED_REF']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Verification requires a full commit SHA; omit ref to use the selected workflow commit.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: uv sync --locked
      - run: uv run --locked check --all
      - name: Verification must not modify tracked source
        run: git diff --exit-code

  package:
    needs: [resolve, verify]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package
      - name: Verify the patched Mac path resolver
        run: uv run --locked python -m tests.native.mac_path_normalization

  native-mac:
    needs: [resolve, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Verify downloaded artifacts
        working-directory: ${{ runner.temp }}/candidate
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Build through the developer command
        run: uv run --locked python -m tests.native.dev_workflow_smoke
      - name: Run native packaged-engine smoke
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: uv run --locked python -m tests.native.mac_runtime_smoke "$RUNNER_TEMP"/candidate/Tidebound_Mac_*_universal.zip "$RUNNER_TEMP/smoke" --arch "$TEST_ARCH" --location translocated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    needs: [resolve, package]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Verify downloaded artifacts
        run: uv run --locked python -m tidebound_dev.release.artifacts "$env:RUNNER_TEMP/candidate"
      - name: Prepare pinned software OpenGL for the hosted runner
        run: ./tests/native/setup_windows_ci.ps1
      - name: Build through the developer command
        run: uv run --locked python -m tests.native.dev_workflow_smoke
      - name: Run native Windows packaged-engine smoke
        env:
          # Hosted Windows has no audio output device. This affects CI only.
          ALSOFT_DRIVERS: 'null'
        run: |
          $archive = Get-Item "$env:RUNNER_TEMP/candidate/Tidebound_Windows_*_x64.zip"
          uv run --locked python -m tests.native.windows_runtime_smoke $archive.FullName "$env:RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-smoke-windows-x64
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14

  native-linux:
    needs: [resolve, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Install documented runtime libraries and CI display
        run: |
          sudo apt-get update
          if [ "$(lsb_release -rs)" = '22.04' ]; then alsa=libasound2; else alsa=libasound2t64; fi
          sudo apt-get install -y "$alsa" libpulse0 libgomp1 zlib1g libffi8 libyaml-0-2 libcrypt1 libbsd0 libmd0 libgl1 libegl1 xvfb xauth
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: ${{ runner.temp }}/candidate/
      - run: uv run --locked python -m tidebound_dev.release.artifacts "$RUNNER_TEMP/candidate"
      - name: Build through the developer command
        run: uv run --locked python -m tests.native.dev_workflow_smoke
      - name: Run native Linux player smoke
        env:
          ALSOFT_DRIVERS: 'null'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a uv run --locked python -m tests.native.linux_runtime_smoke "$RUNNER_TEMP"/candidate/Tidebound_Linux_*_x86_64.zip "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-smoke-linux-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn
          retention-days: 14
