name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching version tag on main's history
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          version = json.load(open('release.json'))['version']
          if os.environ['RELEASE_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Run this workflow on the version tag declared in release.json')
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          PY
      - uses: ./.github/actions/package

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.1'
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tidebound-release-candidate
          path: candidate
      - name: Verify artifacts before uploading
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          uv run --locked python - <<'PY'
          import os, sys
          from pathlib import Path
          from tidebound_dev.release.artifacts import validate_candidate
          from tidebound_dev.release.metadata import load_release
          config = load_release()
          validate_candidate(Path('candidate'), config['version'], os.environ['SOURCE_SHA'], config['mac_build'])
          PY
      - name: Publish the release; never overwrite an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "candidate/Tidebound_Mac_${version}_universal.zip" "candidate/Tidebound_Windows_${version}_x64.zip" "candidate/Tidebound_Linux_${version}_x86_64.zip" \
            --verify-tag --title "Tidebound $RELEASE_TAG" --notes-file candidate/RELEASE_NOTES.md
