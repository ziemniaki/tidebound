name: One-time import of verified Tidebound 0.8.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-current-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEMO_SHA256: 59b30082086ede02f784cb777b276de8e4a658a619ed2160ad300d40e573625f
    steps:
      - name: Fetch the verified current project release
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" repository -- --depth=2
          # Only the verified documentation snapshot plus this one-use workflow is allowed.
          test "$(git -C repository rev-parse HEAD^)" = c1620a2d3abfa8e0a9befcc2f77c91595c3c284c
          test "$(git -C repository diff --name-only HEAD^ HEAD)" = '.github/workflows/import-current-demo.yml'
          mkdir -p incoming
          gh release download v0.8.0 --repo "$GITHUB_REPOSITORY" --pattern Tidebound_Project.zip --dir incoming
          printf '%s  %s\n' "$DEMO_SHA256" incoming/Tidebound_Project.zip | sha256sum --check --strict
      - name: Import current source, assets and documentation
        working-directory: repository
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,stat,zipfile
          root=Path.cwd()
          with zipfile.ZipFile('../incoming/Tidebound_Project.zip') as archive:
              for entry in archive.infolist():
                  source=PurePosixPath(entry.filename)
                  if source.is_absolute() or '..' in source.parts or not source.parts or source.parts[0]!='Tidebound_Prototype':
                      raise ValueError('Unexpected archive path')
                  rel=PurePosixPath(*source.parts[1:])
                  if not rel.parts: continue
                  if rel.parts[0] in ('.git','.github') or stat.S_ISLNK(entry.external_attr >> 16):
                      raise ValueError('Unexpected repository metadata or symbolic link')
                  target=root.joinpath(*rel.parts)
                  if entry.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(archive.read(entry))
                      if entry.external_attr >> 16 & 0o111: target.chmod(0o755)
          manifest=json.loads((root/'BUILD_MANIFEST.json').read_text())
          assert manifest['version']=='0.8.0'
          for rel,digest in manifest['sha256'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
          assert not list(root.rglob('Game.rxdata'))
          print('Current source snapshot and tracked hashes verified.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Remove the only trigger before publishing: no future write automation remains.
          rm .github/workflows/import-current-demo.yml
          git add --all
          git commit -m 'Import Tidebound Demo 1 (0.8.0) current source and assets'
          git push origin HEAD:main
      - name: Record imported commit
        working-directory: repository
        run: |
          echo '## Tidebound 0.8.0 imported' >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
          echo 'The project ZIP checksum and build manifest hashes were verified before committing.' >> "$GITHUB_STEP_SUMMARY"
