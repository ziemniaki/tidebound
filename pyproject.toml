[project]
name = "tidebound-dev"
version = "0.1.0"
description = "Local development commands for Tidebound"
requires-python = ">=3.12,<3.14"
dependencies = [
    "rubymarshal==1.2.10",
    "Pillow==12.3.0",
    "filelock==4.0.4",
]

[project.scripts]
tidebound = "tidebound_dev.cli:main"
build = "tidebound_dev.cli:build"
play = "tidebound_dev.cli:play"
preview = "tidebound_dev.cli:preview"
check = "tidebound_dev.cli:check"
rebuild = "tidebound_dev.cli:rebuild"
editor = "tidebound_dev.cli:editor"
format = "tidebound_dev.cli:format"

[build-system]
requires = ["uv_build==0.12.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tidebound_dev"
module-root = "tools"

[dependency-groups]
dev = [
    "ruff==0.16.9",
]
docs = [
    "reportlab==5.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["content/**/*.py", "tools/**/*.py", "tests/**/*.py", ".github/scripts/*.py"]
extend-exclude = ["tests/engine_reference"]
